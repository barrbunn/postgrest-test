[project]
name = "pgtest-tools"
version = "0.1.0"
description = "pgprovision CLI and pgrmapper microservice for the PostgREST test rig"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
]

[project.scripts]
pgprovision = "provision.cli:app"
pgrmapper = "pgrmapper.server:main"
pgjwt = "pgjwt.cli:app"
pgmkcurl = "pgmkcurl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provision", "src/pgrmapper"]
