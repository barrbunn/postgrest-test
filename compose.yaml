name: postgrest-pgproxy

# Only the nginx API gateway publishes a host port (NGINX_PORT). Everything
# else is reachable solely inside the internal network:
# host -> gateway -> pgrmapper -> postgrest -> postgres

networks:
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE}
      PGRST_DB_AUTH_ROLE: ${PGRST_DB_AUTH_ROLE}
      PGRST_DB_AUTH_PASSWORD: ${PGRST_DB_AUTH_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [internal]

  postgrest:
    image: ${POSTGREST_IMAGE}
    restart: unless-stopped
    environment:
      # PostgREST sees the database on localhost, served by the
      # pgproxy-postgrest sidecar that shares this container's network
      # namespace.
      PGRST_DB_URI: "postgresql://${PGRST_DB_AUTH_ROLE}:${PGRST_DB_AUTH_PASSWORD}@127.0.0.1:${PGPROXY_PORT}/${POSTGRES_DB}"
      PGRST_DB_SCHEMA: ${PGRST_DB_SCHEMA}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE}
      # JWK set: accepts the gateway-signed RS256 service JWTs and the
      # legacy HS256 tokens (see scripts/gen-certs.sh).
      PGRST_JWT_SECRET: "@/certs/jwt-secrets.json"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # pgproxy sidecar: shares postgrest's network namespace and exposes the
  # database as a "local" service on 127.0.0.1 inside it.
  pgproxy-postgrest:
    build: ./pgproxy
    image: postgrest-pgproxy/pgproxy:local
    restart: unless-stopped
    network_mode: service:postgrest
    environment:
      PGPROXY_LISTEN: "127.0.0.1:${PGPROXY_PORT}"
      PGPROXY_TARGET: ${PGPROXY_TARGET}
    depends_on:
      postgrest:
        condition: service_started
      postgres:
        condition: service_healthy

  # Test driver: minimal image with curl, python and uv. The python project
  # (src/) and provision data (data/) are mounted so local edits are live in
  # the container. Kept alive so tests can be run with
  # `docker compose exec driver ...`.
  driver:
    build:
      context: .
      dockerfile: driver/Dockerfile
    image: postgrest-pgproxy/driver:local
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
    environment:
      # Through pgproxy-driver (local 127.0.0.1)
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${PGPROXY_PORT}/${POSTGRES_DB}"
      # Direct connection (bypasses pgproxy)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGREST_URL: "http://postgrest:3000"
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://postgrest:3000/"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # Read-only filtering proxy in front of PostgREST: the gateway's single
  # backend, connected over mTLS (certs from certs/, generated by
  # scripts/gen-certs.sh). Runs the code baked into the driver image; the
  # driver can run a live-edited plaintext copy for debugging (pgrmapper,
  # port 8000).
  pgrmapper:
    image: postgrest-pgproxy/driver:local
    restart: unless-stopped
    command: ["pgrmapper"]
    environment:
      PGMAPPER_UPSTREAM: "http://postgrest:3000"
      PGMAPPER_DB_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGREMAPPER_PORT: "8443"
      PGMAPPER_TLS_CERT: /certs/server.crt
      PGMAPPER_TLS_KEY: /certs/server.key
      PGMAPPER_TLS_CA: /certs/ca.crt
      PGMAPPER_GATEWAY_JWT_PUBLIC_KEY: /certs/gateway-jwt-public.pem
      PGMAPPER_IDP_JWKS_URL: "http://idp:5151/realms/${IDP_REALM}/protocol/openid-connect/certs"
      PGMAPPER_IDP_AUDIENCE: ${IDP_CLIENT_ID}
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      # mTLS probe: the pgrmapper container presents the gateway client cert
      # to its own TLS endpoint (SAN includes localhost).
      test: ["CMD", "curl", "-sf", "--cacert", "/certs/ca.crt", "--cert", "/certs/client.crt", "--key", "/certs/client.key", "https://localhost:8443/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      driver:
        condition: service_started
      postgres:
        condition: service_healthy
      postgrest:
        condition: service_started
      idp:
        condition: service_started
    networks: [internal]

  # Identity provider mock (keycloak-mockup): issues user JWTs (RS256) and
  # exposes a JWKS endpoint. Published on the host like a real external IdP.
  # amd64-only image: runs under qemu emulation (Python, works fine).
  idp:
    image: ${IDP_IMAGE}
    platform: linux/amd64
    restart: unless-stopped
    command: ["keycloak-mockup", "--config", "/config.yaml"]
    ports:
      - "${IDP_PORT}:5151"
    volumes:
      - ./certs/idp-config.yaml:/config.yaml:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5151/realms/${IDP_REALM}/.well-known/openid-configuration')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [internal]

  # nginx API gateway: the only host-facing entry point. Everything is routed
  # to pgrmapper over mTLS (client -> gateway -> pgrmapper -> postgrest).
  gateway:
    image: ${NGINX_IMAGE}
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      pgrmapper:
        condition: service_started
    networks: [internal]

  # pgproxy sidecar for the driver: same pattern, exposes the database on
  # 127.0.0.1 inside the driver container.
  pgproxy-driver:
    build: ./pgproxy
    image: postgrest-pgproxy/pgproxy:local
    restart: unless-stopped
    network_mode: service:driver
    environment:
      PGPROXY_LISTEN: "127.0.0.1:${PGPROXY_PORT}"
      PGPROXY_TARGET: ${PGPROXY_TARGET}
    depends_on:
      driver:
        condition: service_started
      postgres:
        condition: service_healthy
