# nginx API gateway: single entry point for host access.
# client -> gateway -> pgrmapper -> postgrest
server {
    listen 80;

    location / {
        proxy_pass http://pgrmapper:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
