# nginx API gateway: single entry point for host access, mimicking Apigee.
# client --(user JWT)--> gateway -(mTLS + service JWT)-> pgrmapper -> postgrest
#
# The njs handler (conf.d/apigee.js) runs in the access phase: it verifies
# the user JWT, extracts the role and signs the service JWT, setting
# $service_jwt/$user_role for the proxy_set_header directives below. The
# response is streamed by proxy_pass (no buffering, no size limits).

js_import apigee from conf.d/apigee.js;
js_var $service_jwt;
js_var $user_role;

server {
    listen 80;

    # Internal-only endpoints: never proxied to pgrmapper, invisible outside.
    location = /health {
        return 404;
    }

    location / {
        auth_request /_apigee_auth;

        proxy_pass https://pgrmapper:8443/;
        proxy_ssl_certificate /certs/client.crt;
        proxy_ssl_certificate_key /certs/client.key;
        proxy_ssl_trusted_certificate /certs/ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_name pgrmapper;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer $service_jwt";
        proxy_set_header X-User-Role $user_role;
    }

    # Internal auth subrequest: the njs handler verifies the user JWT,
    # signs the service JWT and sets $service_jwt/$user_role (variables set
    # in an auth_request subrequest are propagated to the main request).
    # On failure it returns 401 with a JSON body.
    location = /_apigee_auth {
        internal;
        js_content apigee.handle;
    }
}

# Liveness probe for the container healthcheck. Served only when the Host
# header is 127.0.0.1 (what the healthcheck sends); outside requests carry
# Host: localhost:<port>, don't match this server_name and fall through to
# the main server above, where /healthz is not defined (they get the njs
# handler -> 401 without a JWT).
server {
    listen 80;
    server_name 127.0.0.1;

    location = /healthz {
        return 200 "ok";
    }
}
